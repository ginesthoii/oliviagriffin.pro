<!DOCTYPE html>
<html lang="en">

<head>
  <!-- ======================================
       META
  ======================================= -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Projects — Olivia Griffin</title>

  <!-- ======================================
       PERFORMANCE (Fonts)
  ======================================= -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@100;300;400;600;700;900&display=swap"
    rel="stylesheet"
  />

  <!-- ======================================
       CSS: Base → Page → Components
  ======================================= -->

  <!-- Page -->
  <link rel="stylesheet" href="projects.css" />

  <!-- Components -->
  <link rel="stylesheet" href="components/loader/loader.css" />

  <!-- ======================================
       FAVICONS
  ======================================= -->
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png" />
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png" />
  <link rel="manifest" href="images/site.webmanifest" />

</head>



<body id="projects">

  <!-- ======================================
       SHARED NAVBAR 
  ======================================= -->
  <div id="navbar-slot"></div>
<script src="/components/navbar/navbar.js" defer></script>


  <!-- ======================================
       HERO
  ======================================= -->
  <header class="page-hero" style="padding-top:120px;">
    <div class="hero-inner">

      <h1>Projects</h1>

      <p>
        Local-first systems • Security-minded builds • Automation • Creative tools
      </p>

      <div class="controls">

        <input
          id="search"
          type="search"
          placeholder="Search projects…"
          aria-label="Search projects"
        />

        <div id="catbar" class="catbar"></div>

        <div class="filter-right">
          <select id="tagSelect">
            <option value="">All tags</option>
          </select>

          <button id="clearFilters" class="clear-btn">
            Clear
          </button>
        </div>

      </div>
    </div>
  </header>



  <!-- ======================================
       MAIN CONTENT
  ======================================= -->
  <main class="page-main">

    <!-- Interactive Cards Mount Point -->
    <div id="sections" class="interactive-cards"></div>

  </main>



  <!-- ======================================
       SCRIPTS
  ======================================= -->

  <!-- Global Site Logic -->
  <script defer src="main.js"></script>

  <!-- Page Module -->
  <script type="module" src="projects.js"></script>



</body>
</html>
