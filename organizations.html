<!DOCTYPE html>
<html lang="en">
<head>

<!-- ======================================
     META
====================================== -->
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>

<title>Organizations — Olivia Griffin</title>

<!-- ======================================
     PERFORMANCE (Fonts)
====================================== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
  href="https://fonts.googleapis.com/css2?family=Lato:wght@100;300;400;600;700;900&display=swap"
  rel="stylesheet"
/>

<!-- ======================================
     CSS LOAD ORDER
     Global → Page → Components
====================================== -->

<!-- GLOBAL SITE SYSTEM (NAVBAR + TOKENS + GLOBAL STRUCTURE) -->
<link rel="stylesheet" href="style.css"/>

<!-- PAGE VISUALS -->
<link rel="stylesheet" href="orgs.css"/>

<!-- ======================================
     FAVICONS
====================================== -->
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon.png"/>
<link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png"/>
<link rel="apple-touch-icon" href="images/apple-touch-icon.png"/>

<!-- ======================================
     CHART LIBRARY
====================================== -->
<script defer src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- ======================================
     PAGE MODULE
====================================== -->
<script type="module" defer src="orgs.js"></script>

</head>

<body id="organizations">

<!-- ======================================
     SHARED NAVBAR SLOT
====================================== -->
<div id="navbar-slot"></div>
<script src="components/navbar/navbar.js" defer></script>

<!-- ======================================
     MAIN CONTENT
====================================== -->
<main class="section orgs-page">

  <!-- =========================
       INTRO
  ========================== -->
  <div class="section-intro orgs-intro">
    <h5>Labs + Ecosystems</h5>
    <h1>Organizations</h1>
    <p class="lead">
      Independent orgs and long-running systems I maintain and evolve.
    </p>
  </div>

  <!-- =========================
       ANALYTICS
  ========================== -->
  <section class="org-analytics">

    <h2>Org Analytics</h2>

    <div class="chart-layout">

      <!-- ROW 1 -->
      <div class="chart-micro donut">
        <canvas id="langChart"></canvas>
      </div>

      <div class="chart-micro thin">
        <canvas id="tagChart"></canvas>
      </div>

      <div class="chart-micro donut">
        <canvas id="categoryChart"></canvas>
      </div>

      <!-- ROW 2 -->
      <div class="chart-micro wide">
        <canvas id="timelineChart"></canvas>
      </div>

      <div class="chart-micro heat">
        <div id="heatmapChart" class="heatmap-micro"></div>
      </div>

    </div>

  </section>

  <!-- =========================
       SEARCH
  ========================== -->
  <section class="org-search">
    <input
      id="orgSearch"
      type="search"
      placeholder="Search orgs, tags, tech, descriptions…"
      aria-label="Search organizations"
      autocomplete="off"
    />
  </section>

  <!-- =========================
       FILTERS
  ========================== -->
  <section class="org-filters" aria-label="Organization filters">

    <div class="filter-row">
      <button class="filter-pill is-active" data-category="All">All</button>
      <button class="filter-pill" data-category="Security">Security</button>
      <button class="filter-pill" data-category="Homestead">Homestead</button>
      <button class="filter-pill" data-category="AI">AI</button>
      <button class="filter-pill" data-category="Creative">Creative</button>
    </div>

    <div class="filter-meta">

      <div class="active-tag">
        <span class="label">Tag filter:</span>
        <span id="activeTagValue" class="value">None</span>
        <button id="clearTagBtn" class="mini-btn" type="button">Clear</button>
      </div>

      <div class="hint">
        Click a tag on any card to filter by that tag (click again to toggle off).
      </div>

    </div>

  </section>

  <!-- =========================
       CARDS
  ========================== -->
  <section class="org-grid">
    <div class="cards" id="orgCards"></div>
  </section>

</main>

<!-- ======================================
     GLOBAL SITE LOGIC
====================================== -->
<script defer src="main.js"></script>

</body>
</html>
